<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
      #rectangle {
        width: 300px;
        height: 300px;
        background-color: goldenrod;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        margin: auto;
        margin-top: 170px;
      }
      #myBtn {
        display: block;
        margin: 20px auto;
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
        background-color: teal;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      #myBtn1 {
        display: block;
        margin: 20px auto;
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
        background-color: teal;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      #rectangle.transition {
        border-radius: 50%;
        transition: 1.5s ease;
      }
      #rectangle.transition1 {
        transition: 1.5s ease;
        translate: -30rem 0;
        border-radius: 50%;
        background-color: cadetblue;
      }
      #rectangle.transition2 {
        transition: 1.5s ease;
        translate: 0 0;
        border-radius: 0%;
        background-color: goldenrod;
      }
      #rectangle.transition3 {
        transition: 1.5s ease;
        translate: 30rem 0;
        border-radius: 50%;
        background-color: chocolate;
      }
      #rectangle.transition4 {
        transition: 1.5s ease;
        translate: 0 0;
        background-color: goldenrod;
        border-radius: 0%;
      }
    </style>
  </head>
  <body>
    <section>
      <div id="rectangle"></div>
      <button id="myBtn">Click Me</button>
      <button id="myBtn1">Click Me</button>
    </section>

    <script>
      let rect = document.getElementById("rectangle");
      let Btn = document.getElementById("myBtn");
      let Btn1 = document.getElementById("myBtn1");

      Btn.addEventListener("click", function () {
        console.log("click");
        rect.style.backgroundColor = "red";
      });

      Btn.addEventListener("dblclick", function () {
        console.log("dblclick");
        rect.classList.add("transition");
      });

      rect.addEventListener("mouseover", function () {
        console.log("mouseover");
        rect.classList.add("transition1");
      });

      rect.addEventListener("mouseout", function () {
        console.log("mouseout");
        rect.classList.add("transition2");
      });

      Btn1.addEventListener("mousedown", function () {
        console.log("mousedown");
        rect.classList.add("transition3");
      });

      Btn1.addEventListener("mouseup", function () {
        console.log("mouseup");
        rect.classList.add("transition4");
      });
    </script>
  </body>
</html>
